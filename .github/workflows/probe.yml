name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests beautifulsoup4 -q
      - shell: python
        run: |
          import requests, json
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36','Referer':'https://m.stock.naver.com/'}
          for u in ['https://m.stock.naver.com/api/stock/005930/finance/quarter',
                    'https://m.stock.naver.com/api/stock/005930/basic',
                    'https://m.stock.naver.com/api/stock/005930/integration',
                    'https://m.stock.naver.com/api/news/stock/005930?pageSize=5&page=1',
                    'https://m.stock.naver.com/front-api/news/category?category=mainnews&pageSize=5&page=1',
                    'https://m.stock.naver.com/api/news/list?category=mainnews&pageSize=5&page=1',
                    'https://finance.naver.com/news/mainnews.naver',
                    'https://finance.naver.com/item/main.naver?code=005930']:
            try:
              r=requests.get(u,headers=H,timeout=20); print('URL',u,r.status_code,r.headers.get('content-type'),len(r.content)); print('BODY',r.text[:1500].replace('\n',' '))
            except Exception as e: print('ERR',u,e)
          r=requests.get('https://finance.naver.com/item/main.naver?code=005930',headers=H,timeout=20)
          t=r.text; i=t.find('기업실적분석'); print('IDX',i, t[i-200:i+2500].replace('\n',' ') if i>0 else t[:3000].replace('\n',' '))
