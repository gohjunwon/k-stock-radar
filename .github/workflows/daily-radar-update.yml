name: Daily K-Stock Catalyst Radar Update

on:
  schedule:
    - cron: '30 22 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-radar-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate fresh pre-market data.json with 2-step fact check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - << 'EOF'
          import json, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta

          kst = timezone(timedelta(hours=9))
          now_str = datetime.now(kst).strftime('%Y-%m-%d %H:%M KST')

          blocked_words = ['가짜', '허위', '루머', '지라시', '미확인', '추측성', '오보', '확인불가', '설(說)']

          def first_fact_check(title, source):
              if not title or len(title.strip()) < 8 or not source.strip():
                  return False
              low = title.lower()
              return not any(w.lower() in low for w in blocked_words)

          def second_fact_check(title, seen_norms):
              norm = ''.join(ch for ch in title if ch.isalnum())[:14]
              if not norm or norm in seen_norms or '???' in title:
                  return False, norm
              return True, norm

          with open('data.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          data['updatedAt'] = now_str

          rss_url = 'https://www.hankyung.com/feed/finance'
          verified_news = []
          try:
              req = urllib.request.Request(rss_url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=10) as resp:
                  xml_bytes = resp.read()
              root = ET.fromstring(xml_bytes)
              seen_norms = set()
              for idx, item in enumerate(root.findall('./channel/item')[:15]):
                  title = (item.findtext('title') or '').strip()
                  source = '한국경제 RSS'
                  if not first_fact_check(title, source):
                      continue
                  ok2, norm = second_fact_check(title, seen_norms)
                  if not ok2:
                      continue
                  seen_norms.add(norm)
                  verified_news.append({
                      'id': f'rss_{idx}',
                      'time': datetime.now(kst).strftime('%H:%M'),
                      'ticker': '005930',
                      'name': '시장주요',
                      'sector': '증시속보',
                      'headline': title,
                      'source': source,
                      'impact': '중간',
                      'detail': '1차·2차 사실확인을 통과한 증권 섹션 뉴스입니다.'
                  })
          except Exception as e:
              print('RSS fetch skipped:', e)

          if verified_news:
              data['todayNews'] = verified_news

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print('Updated data.json with 2-step fact check at', now_str)
          EOF

      - name: Commit and push updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update radar data with 2-step fact verification"
          git push
