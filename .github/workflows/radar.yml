name: 국내주식 호재 레이더 자동 수집

on:
  schedule:
    - cron: '50 21 * * 0-4'    # 평일 06:50 KST: 장 시작 전 전체 수집(상장사 목록·실적·뉴스) — 알람이 어긋나도 꼭 실행
    - cron: '40 22 * * 0-4'    # 평일 07:40 KST: 예비 뉴스 수집 (장 시작 1시간 전까지 한 번 더)
    # 뉴스 수집(평일 08:00~15:50은 10분마다, 그 밖에는 30분마다)은 Cloudflare 알람이 보냅니다.
    - cron: '17 */3 * * *'     # 예비용: 알람이 멈춰도 3시간마다 뉴스
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = 전체(상장사·실적 갱신), news = 뉴스만'
        type: choice
        options: [full, news]
        default: news

permissions:
  contents: write

concurrency:
  group: radar-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -q requests beautifulsoup4

      - name: 수집
        run: |
          MODE=news
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          if [ "${{ github.event.schedule }}" = "50 21 * * 0-4" ]; then MODE=full; fi
          python scripts/collect.py --mode "$MODE"

      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet && exit 0
          git commit -q -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 자동 수집"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            sleep 5
          done
          exit 1
