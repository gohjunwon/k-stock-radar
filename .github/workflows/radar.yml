name: 국내주식 호재 레이더 자동 수집

on:
  schedule:
    - cron: '30 22 * * 0-4'    # 평일 07:30 KST: 전체 수집 + AI(일정·시장일정·추천) 하루 1번
    - cron: '*/10 23 * * 0-4'  # 평일 08:00~08:50 KST: 뉴스만 (AI 없음)
    - cron: '*/10 0-6 * * 1-5' # 평일 09:00~15:50 KST: 뉴스만 (AI 없음)
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = AI 포함 전체, news = 뉴스만'
        type: choice
        options: [full, news]
        default: news

permissions:
  contents: write

concurrency:
  group: radar-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -q requests beautifulsoup4

      - name: 수집
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODE=news
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          if [ "${{ github.event.schedule }}" = "30 22 * * 0-4" ]; then MODE=full; fi
          python scripts/collect.py --mode "$MODE"

      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet && exit 0
          git commit -q -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 자동 수집"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            sleep 5
          done
          exit 1
