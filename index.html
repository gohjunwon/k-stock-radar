<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <title>국내주식 호재 레이더</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Noto Sans KR"', 'system-ui', '-apple-system', 'sans-serif'] },

    };
  </script>

    body { background-color: #f8fafc; color: #0f172a; }

<body class="min-h-screen flex flex-col">

  <header class="glass-header sticky top-0 z-40 border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-navy-900 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-navy-950">국내주식 호재 레이더</h1>
            <span id="session-badge" class="px-2.5 py-0.5 text-[11px] font-bold rounded-full bg-navy-900 text-white">-</span>
            <span id="stale-badge" class="hidden px-2.5 py-0.5 text-[11px] font-bold rounded-full bg-amber-100 text-amber-900 border border-amber-300 cursor-help" onclick="alert(this.title)"></span>
          </div>
          <p id="header-sub" class="text-xs text-slate-600 mt-0.5">불러오는 중...</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="ai-btn" onclick="openAiModal()" class="px-3.5 py-2 rounded-lg text-xs sm:text-sm font-bold bg-white border border-navy-900 text-navy-900 hover:bg-slate-100">🤖 내 AI 연결</button>
        <button onclick="loadAll(true)" class="px-3.5 py-2 rounded-lg text-xs sm:text-sm font-bold bg-navy-900 hover:bg-navy-800 text-white">↻ 새로고침</button>
      </div>
    </div>
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 overflow-x-auto">
      <div id="tab-bar" class="flex items-center gap-1 border-t border-slate-100 py-1.5 min-w-max"></div>
    </nav>
  </header>

  <div id="modal"></div>
  <main id="app" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-5"></main>

  <footer class="border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-500 px-4 leading-relaxed">
    뉴스·주가·실적: 네이버 증권과 언론사 RSS에서 자동 수집 (장중 10분마다) · 일정·추천: 각자 연결한 AI(Gemini·ChatGPT·Claude)가 정리 — AI 키는 이 기기 브라우저에만 저장되고 해당 AI 회사로만 전송됩니다<br>
    투자 전 반드시 원문 기사와 공시(DART)를 확인하세요.
  </footer>

<script>
'use strict';

const TABS = [
  { id: 'picks',    label: '1. AI 추천종목',   ai: true },
  { id: 'news',     label: '2. 오늘의 호재' },
  { id: 'events',   label: '3. 1달 앞 주요일정', ai: true },
  { id: 'earnings', label: '4. 실적 미리보기' },
  { id: 'market',   label: '5. 시장일정',      ai: true },
  { id: 'calendar', label: '6. 통합 캘린더' },
  { id: 'watch',    label: '7. 관심종목 뉴스' },
];
const NEWS_CATS = ['전체', '수주·계약', '기술수출', '임상·허가', '실적', '주주환원', 'M&A·투자', '급등·특징주', '정책·수혜'];
const EVENT_CATS = ['전체', '임상', 'FDA', '회사', '학회', '실적', 'M&A'];

// GitHub 저장소 주소 (관심종목 상시 목록 편집·키 등록 안내용)
const REPO = (() => {
  const h = location.hostname, p = location.pathname.split('/').filter(Boolean);
  if (h.endsWith('github.io')) return `https://github.com/${h.split('.')[0]}/${p[0] || ''}`;
  return 'https://github.com/gohjunwon/k-stock-radar';
})();

function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
// AI 키: 기본은 이 탭(창)을 닫으면 지워지는 sessionStorage, '이 기기에 기억'을 고른 경우에만 localStorage
function keyGet() {
  try { const v = sessionStorage.getItem('kradar_ai'); if (v) return JSON.parse(v); } catch (e) {}
  return lsGet('kradar_ai', null);
}
function keySet(cfg) {
  try {
    if (!cfg) { sessionStorage.removeItem('kradar_ai'); localStorage.removeItem('kradar_ai'); return; }
    if (cfg.remember) { localStorage.setItem('kradar_ai', JSON.stringify(cfg)); sessionStorage.removeItem('kradar_ai'); }
    else { sessionStorage.setItem('kradar_ai', JSON.stringify(cfg)); localStorage.removeItem('kradar_ai'); }
  } catch (e) {}
}

const state = {
  tab: lsGet('kradar_tab', 'news'),
  news: null, earnings: null, watch: null, stocks: null, status: null,
  loadError: '',
  newsCat: '전체', sector: '전체', eventCat: '전체', earnIdx: 0,
  calMonth: '', calDate: '',
  myWatch: lsGet('kradar_mywatch', []),   // 이 기기에서만 추가한 관심종목
  watchIdx: 0,
};

/* ───────── 도구 ───────── */
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(n, suffix = '') { return (n === null || n === undefined || n === '' || isNaN(n)) ? '-' : Number(n).toLocaleString() + suffix; }
function eok(n) { // 억원 → 읽기 쉬운 단위
  if (n === null || n === undefined || isNaN(n)) return '-';
  const a = Math.abs(n);
  return a >= 10000 ? (n / 10000).toFixed(a >= 100000 ? 1 : 2).replace(/\.?0+$/, '') + '조원' : Math.round(n).toLocaleString() + '억원';
}
function kstNow() {
  const now = new Date();
  const s = now.toLocaleString('sv-SE', { timeZone: 'Asia/Seoul' });
  const [date, time] = s.split(' ');
  const [hh, mm] = time.split(':').map(Number);
  const wd = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Seoul', weekday: 'short' }).format(now);
  const weekday = !['Sat', 'Sun'].includes(wd), m = hh * 60 + mm;
  let session = '주말 휴장';
  if (weekday) session = m < 480 ? '장외 시간' : m < 540 ? '장 시작 전' : m <= 930 ? '정규장 운영 중' : m <= 1080 ? '장 마감 후' : '장외 시간';
  return { date, ym: date.slice(0, 7), session };
}
function addDays(d, n) { const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd + n)).toISOString().slice(0, 10); }
function dayName(d) { const [y, m, dd] = d.split('-').map(Number); return '일월화수목금토'[new Date(y, m - 1, dd).getDay()]; }
function naverNews(q) { return `https://search.naver.com/search.naver?where=news&sort=1&query=${encodeURIComponent(q)}`; }
function naverStock(code, name) { return code ? `https://m.stock.naver.com/domestic/stock/${code}/total` : naverNews(name + ' 주가'); }
function gcal(title, date, details, time) {
  const d = date.replace(/-/g, '');
  let dates = `${d}/${addDays(date, 1).replace(/-/g, '')}`;
  if (/^\d{2}:\d{2}$/.test(time || '')) {
    const [h, m] = time.split(':').map(Number), e = Math.min(h * 60 + m + 60, 23 * 60 + 59);
    const p = x => String(x).padStart(2, '0');
    dates = `${d}T${p(h)}${p(m)}00/${d}T${p(Math.floor(e / 60))}${p(e % 60)}00&ctz=Asia/Seoul`;
  }
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${dates}&details=${encodeURIComponent(details || '')}`;
}
function a(url, text, cls = 'text-slate-600 hover:underline') { if (!/^https?:\/\//i.test(String(url || ''))) url = '#'; return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="${cls}">${text}</a>`; }

/* ───────── 데이터 불러오기 (AI 호출 없음, 저장된 결과 파일만 읽음) ───────── */
async function getJson(name) {
  const r = await fetch(`data/${name}?t=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${name} (${r.status})`);
  return r.json();
}
let lastSig = '';
async function loadAll(force) {
  const names = ['news', 'earnings', 'watch'];
  const res = await Promise.allSettled(names.map(n => getJson(n + '.json')));
  const failed = [];
  res.forEach((r, i) => { if (r.status === 'fulfilled') state[names[i]] = r.value; else failed.push(names[i]); });
  state.loadError = failed.length === names.length ? '아직 수집된 데이터가 없습니다. 첫 자동 수집이 끝나면(몇 분 이내) 표시됩니다.' : '';
  getJson('status.json').then(j => { state.status = j; updateHeader(); }).catch(() => {});
  if (!state.stocks) getJson('stocks.json').then(j => { state.stocks = j.stocks || []; if (state.tab === 'watch') render(); }).catch(() => {});
  const sig = names.map(n => state[n]?.updatedAt || '').join('|');
  if (force || sig !== lastSig) { lastSig = sig; render(); } else updateHeader();
}

/* ───────── 공통 조각 ───────── */
function head(title, desc, updated, aiNote) {
  return `
    <div class="rounded-2xl bg-white border border-slate-200 p-5">
      <div class="flex flex-wrap items-center gap-2">
        <h2 class="text-lg sm:text-xl font-extrabold text-navy-950">${title}</h2>
        ${aiNote ? `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-blue-50 text-navy-800 border border-blue-200">AI · 각자 연결한 AI</span>`
                 : `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-800 border border-emerald-200">AI 없음 · 네이버/언론 자동 수집</span>`}
      </div>
      <p class="text-xs sm:text-sm text-slate-600 mt-1">${desc}</p>
      <p class="text-[11px] text-slate-500 mt-1">${updated ? '업데이트: ' + esc(updated) : ''}</p>
    </div>`;
}
function emptyMsg(text) { return `<div class="rounded-2xl bg-white border border-slate-200 p-10 text-center text-sm text-slate-500">${text}</div>`; }
/* ───────── 내 AI 연결 (각자 본인 키 · 이 기기 브라우저에만 저장 · 해당 AI 회사로만 전송) ───────── */
const AI_PROVIDERS = {
  gemini: { label: 'Google Gemini', short: 'Gemini', keyUrl: 'https://aistudio.google.com/app/apikey',
            hint: '무료 키로도 쓸 수 있습니다. AIza… 로 시작합니다.', models: ['gemini-flash-latest', 'gemini-3.5-flash', 'gemini-2.5-flash', 'gemini-flash-lite-latest'] },
  openai: { label: 'ChatGPT (OpenAI)', short: 'ChatGPT', keyUrl: 'https://platform.openai.com/api-keys',
            hint: '사용한 만큼 요금이 나옵니다(선불 충전 필요). sk-… 로 시작합니다.', models: ['gpt-5.4-mini', 'gpt-5-mini', 'gpt-5.4', 'gpt-4.1-mini'] },
  claude: { label: 'Claude (Anthropic)', short: 'Claude', keyUrl: 'https://console.anthropic.com/settings/keys',
            hint: '사용한 만큼 요금이 나옵니다(선불 충전 필요). sk-ant-… 로 시작합니다.', models: ['claude-haiku-5-5', 'claude-sonnet-5-5', 'claude-haiku-4-5', 'claude-sonnet-4-5'] },
};
state.ai = keyGet();                       // { provider, key, auto, model, remember }
if (state.ai && !AI_PROVIDERS[state.ai.provider]) state.ai = null;
state.myDaily = lsGet('kradar_myai', null); // 내 AI가 정리한 결과
state.aiRun = { busy: false, msg: '' };
state.modal = null;

function aiData() { return state.ai ? state.myDaily : null; }
function guessProvider(key) { return /^AIza/.test(key) ? 'gemini' : /^sk-ant-/.test(key) ? 'claude' : /^sk-/.test(key) ? 'openai' : ''; }
function kstStamp() { return new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Seoul' }).slice(0, 16); }

function aiError(status, msg) {
  const m = String(msg || '');
  const e = new Error();
  if (status === 404 || (status === 400 && /model/i.test(m) && /(not.?found|not exist|does not exist|not supported|invalid model|unknown model)/i.test(m))) { e.model = true; e.message = '모델 없음: ' + m.slice(0, 120); }
  else if (status === 401 || status === 403 || /api key not valid|invalid.{0,10}api.?key|incorrect api key|authentication/i.test(m)) { e.auth = true; e.message = 'AI 키가 맞지 않거나 권한이 없습니다. 키를 다시 확인해 주세요.'; }
  else if (status === 429) e.message = 'AI 사용 한도를 넘었습니다. 잠시 후 다시 하거나, 해당 AI 사이트에서 요금제·잔액을 확인해 주세요.';
  else if (status === 402 || /credit|billing|balance|quota/i.test(m)) e.message = '결제(잔액) 문제로 거절되었습니다. 해당 AI 사이트에서 잔액을 확인해 주세요.';
  else if (status >= 500) e.message = 'AI 서비스가 잠시 바쁩니다. 몇 분 뒤 다시 해 주세요.';
  else e.message = `AI 오류(${status}): ${m.slice(0, 200)}`;
  return e;
}
async function aiFetch(url, headers, body) {
  let r;
  try { r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', ...headers }, body: JSON.stringify(body) }); }
  catch (e) { throw new Error('AI 서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw aiError(r.status, j.error?.message || j.message || JSON.stringify(j).slice(0, 200));
  return j;
}

// 각 회사별 호출 → { text, cites: [{ seg, title, uri }] }
async function callGemini(key, model, prompt, search) {
  const body = { contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { temperature: 0.2 } };
  if (search) body.tools = [{ google_search: {} }];
  const j = await aiFetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, { 'x-goog-api-key': key }, body);
  const cand = (j.candidates || [{}])[0];
  const text = ((cand.content || {}).parts || []).map(p => p.text || '').join('');
  const meta = cand.groundingMetadata || {};
  const chunks = (meta.groundingChunks || []).map(c => ({ title: c.web?.title || '출처', uri: c.web?.uri || '' }));
  const cites = (meta.groundingSupports || []).flatMap(s => (s.groundingChunkIndices || []).map(i => ({ seg: s.segment?.text || '', ...(chunks[i] || {}) })));
  return { text, cites };
}
async function callOpenAI(key, model, prompt, search) {
  const tries = search ? ['web_search', 'web_search_preview'] : [null];
  let last;
  for (const tool of tries) {
    try {
      const body = { model, input: prompt };
      if (tool) body.tools = [{ type: tool }];
      const j = await aiFetch('https://api.openai.com/v1/responses', { Authorization: 'Bearer ' + key }, body);
      let text = '', cites = [];
      (j.output || []).filter(o => o.type === 'message').forEach(o => (o.content || []).forEach(c => {
        if (c.type !== 'output_text') return;
        const t = c.text || '';
        (c.annotations || []).filter(x => x.type === 'url_citation').forEach(x =>
          cites.push({ seg: t.slice(Math.max(0, (x.start_index || 0) - 300), (x.end_index || 0) + 50), title: x.title || '출처', uri: x.url }));
        text += t;
      }));
      return { text, cites };
    } catch (e) {
      last = e;
      if (e.auth || e.model || !/tool|web_search/i.test(e.message)) throw e;
    }
  }
  throw last;
}
async function callClaude(key, model, prompt, search) {
  const headers = { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
  const messages = [{ role: 'user', content: prompt }];
  let text = '', cites = [];
  for (let turn = 0; turn < 3; turn++) {
    const body = { model, max_tokens: 4096, messages };
    if (search) body.tools = [{ type: 'web_search_20250305', name: 'web_search', max_uses: 5 }];
    let j;
    try { j = await aiFetch('https://api.anthropic.com/v1/messages', headers, body); }
    catch (e) { if (/web.?search/i.test(e.message) && !e.auth) e.message = 'Claude 웹 검색이 꺼져 있습니다. Anthropic 콘솔 설정에서 웹 검색(Web search)을 켜 주세요.'; throw e; }
    (j.content || []).forEach(b => {
      if (b.type !== 'text') return;
      text += b.text || '';
      (b.citations || []).forEach(c => c.url && cites.push({ seg: b.text || '', title: c.title || '출처', uri: c.url }));
    });
    if (j.stop_reason !== 'pause_turn') break;
    messages.push({ role: 'assistant', content: j.content });
  }
  return { text, cites };
}
const AI_CALL = { gemini: callGemini, openai: callOpenAI, claude: callClaude };

// 모델 이름은 자동으로 고릅니다(없는 모델이면 다음 후보로). 잘 되는 모델은 기억해 둡니다.
async function askAI(cfg, prompt, search = true) {
  const p = AI_PROVIDERS[cfg.provider];
  const models = [...new Set([cfg.model, ...p.models].filter(Boolean))];
  let last;
  for (const m of models) {
    try {
      const out = await AI_CALL[cfg.provider](cfg.key, m, prompt, search);
      if (cfg.model !== m) { cfg.model = m; if (state.ai === cfg) keySet(cfg); }
      return out;
    } catch (e) { last = e; if (!e.model) throw e; }
  }
  throw new Error(`${p.short}에서 쓸 수 있는 모델을 찾지 못했습니다. (${last?.message || ''})`);
}

function parseJsonArray(text) {
  const t = String(text || '').replace(/```(json)?/g, '').trim();
  const i = t.indexOf('['), j = t.lastIndexOf(']');
  if (i < 0 || j <= i) throw new Error('AI 답변에서 결과 목록을 찾지 못했습니다.');
  const body = t.slice(i, j + 1);
  try { return JSON.parse(body); } catch (e) { return JSON.parse(body.replace(/,\s*([\]}])/g, '$1')); }
}
function linkSources(item, fields, cites) {
  const keys = fields.map(f => String(item[f] || '').trim().slice(0, 12)).filter(k => k.length >= 2);
  const seen = new Set(), out = [];
  cites.forEach(c => { if (/^https?:\/\//i.test(c.uri || '') && !seen.has(c.uri) && keys.some(k => (c.seg || '').includes(k))) { seen.add(c.uri); out.push({ title: c.title, uri: c.uri }); } });
  return out.slice(0, 3);
}
function stockLookup(v) {
  const s = String(v || '').trim(); if (!s) return null;
  const list = state.stocks || [], code = (s.match(/\d{6}/) || [])[0], n = s.replace(/\s/g, '');
  return (code && list.find(x => x.c === code)) || list.find(x => x.n === s) || list.find(x => x.n.replace(/\s/g, '') === n) || null;
}

async function runMyAI() {
  if (!state.ai || state.aiRun.busy) return;
  const cfg = state.ai, today = kstNow().date, until = addDays(today, 31);
  const prev = state.myDaily || {};
  const result = { updatedAt: kstStamp(), provider: cfg.provider, status: 'ok', error: '',
                   events: prev.events || [], market: prev.market || [], picks: prev.picks || [] };
  const step = msg => { state.aiRun = { busy: true, msg }; render(); };

              <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${n.tone === 'positive' ? 'bg-emerald-50 text-emerald-700' : n.tone === 'negative' ? 'bg-rose-50 text-rose-700' : 'bg-slate-200 text-slate-600'}">${n.tone === 'positive' ? '호재 키워드' : n.tone === 'negative' ? '악재 키워드' : '일반'}</span></div>
            <div class="text-sm font-bold">${n.link ? a(n.link, esc(n.title), 'hover:underline') : esc(n.title)}</div>
            ${n.desc ? `<p class="text-xs text-slate-600">${esc(n.desc)}…</p>` : ''}</div>`).join('')
            : '<p class="text-sm text-slate-500 py-8 text-center rounded-xl bg-slate-50">최근 1주일 기사가 없습니다.</p>'}
        ` : ''}
      </div>
    </div>`;
}
function selWatch(i) { state.watchIdx = i; render(); }
function addWatch(ev) {
  ev.preventDefault();
  const raw = document.getElementById('watch-input').value.trim();
  const code = (raw.match(/\d{6}/) || [])[0];
  const name = raw.replace(/\(?\s*\d{6}\s*\)?/, '').trim();
  const s = (state.stocks || []).find(x => (code && x.c === code) || (name && x.n === name));
  if (!s) { alert('상장사 목록에서 찾지 못했습니다. 정확한 종목명이나 6자리 코드를 입력해 주세요.'); return; }
  if (!watchList().some(w => w.code === s.c)) state.myWatch.unshift({ name: s.n, code: s.c, sector: s.s });
  lsSet('kradar_mywatch', state.myWatch);
  state.watchIdx = watchList().findIndex(w => w.code === s.c);
  render();
}
function removeWatch(code) { state.myWatch = state.myWatch.filter(m => m.code !== code); lsSet('kradar_mywatch', state.myWatch); render(); }

/* ───────── 그리기 ───────── */
// '갱신 지연' 판단: 평일 09:00~16:30은 60분, 그 밖(주말·휴장·밤)은 4시간 넘게 수집 확인이 없으면 지연.
// 평일 07:00 이후인데 오늘 아침 전체 갱신(06:50 예약/07:00 알람)이 없으면 그것도 지연으로 표시.
function staleInfo() {
  const st = state.status; if (!st) return null;
  const last = st.checkedAt || st.updatedAt; if (!last) return null;
  const toMs = s => Date.parse(s.replace(' ', 'T') + ':00+09:00');
  const k = kstNow(), now = Date.now(), age = (now - toMs(last)) / 60000;
  const hm = new Date(now + 9 * 3600e3), m = hm.getUTCHours() * 60 + hm.getUTCMinutes(), wd = hm.getUTCDay();
  const weekday = wd >= 1 && wd <= 5;
  const limit = weekday && m >= 540 && m <= 990 ? 60 : 240;
  const fails = (st.failed || []).length ? ` · 실패한 출처: ${(st.failed || []).join(', ')}` : '';
  if (age > limit) return { label: '갱신 지연', detail: `마지막 수집 확인 ${last} (${Math.round(age)}분 전)${fails}` };
  if (weekday && m >= 420 && (st.fullAt || '').slice(0, 10) !== k.date)
    return { label: '아침 갱신 안 됨', detail: `오늘 07:00 전후 전체 갱신 기록이 없습니다 (마지막 전체 갱신 ${st.fullAt || '-'})${fails}` };
  if (fails) return { label: '일부 출처 실패', detail: fails.slice(3) };
  return null;
}
function updateHeader() {
  const k = kstNow();
  document.getElementById('session-badge').textContent = k.session;
  const btn = document.getElementById('ai-btn');
  if (btn) btn.textContent = state.ai ? `🤖 ${AI_PROVIDERS[state.ai.provider].short} 연결됨` : '🤖 내 AI 연결';
  const lag = staleInfo(), lb = document.getElementById('stale-badge');
  if (lb) { lb.textContent = lag ? '⚠ ' + lag.label : ''; lb.title = lag ? lag.detail : ''; lb.classList.toggle('hidden', !lag); }
  const n = state.news?.updatedAt, d = aiData()?.updatedAt;
  document.getElementById('header-sub').textContent = n || d
    ? `뉴스 ${n ? n.slice(5) : '-'} 수집 · AI 정리 ${d ? d.slice(5) : '-'} · 장중 10분마다 자동 갱신`
    : (state.loadError || '불러오는 중...');
}
function render() {
  if (!TABS.some(t => t.id === state.tab)) state.tab = 'news';
  document.getElementById('tab-bar').innerHTML = TABS.map(t => `<button onclick="switchTab('${t.id}')" class="px-3.5 py-2 rounded-lg text-xs sm:text-sm font-bold ${state.tab === t.id ? 'bg-navy-900 text-white' : 'text-slate-600 hover:text-navy-950 hover:bg-slate-100'}">${t.label}</button>`).join('');
  updateHeader();
  const views = { picks: renderPicks, news: renderNews, events: renderEvents, earnings: renderEarnings, market: renderMarket, calendar: renderCalendar, watch: renderWatch };
  const typing = document.activeElement?.id === 'watch-input' ? document.activeElement.value : null;
  document.getElementById('app').innerHTML = views[state.tab]();
  if (typing !== null) { const el = document.getElementById('watch-input'); if (el) { el.value = typing; el.focus(); } }
  if (state.tab === 'earnings') mountChart();
}
function switchTab(id) { state.tab = id; lsSet('kradar_tab', id); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

render();
loadAll(true).then(maybeAutoRun);
setInterval(() => { if (!document.hidden) loadAll(false); }, 60000); // 1분마다 새 파일이 있는지만 확인 (AI 호출 없음)
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll(false); });
</script>
