<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>국내주식 호재 레이더</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Noto Sans KR"', 'system-ui', '-apple-system', 'sans-serif'] },
          colors: { navy: { 950: '#0a1122', 900: '#0f172a', 800: '#172554', 700: '#1e3a8a' } }
        }
      }
    };
  </script>
  <style>
    body { background-color: #f8fafc; color: #0f172a; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .glass-header { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); }
    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="glass-header sticky top-0 z-40 border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-navy-900 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-navy-950">국내주식 호재 레이더</h1>
            <span id="session-badge" class="px-2.5 py-0.5 text-[11px] font-bold rounded-full bg-navy-900 text-white">-</span>
          </div>
          <p id="header-sub" class="text-xs text-slate-600 mt-0.5">불러오는 중...</p>
        </div>
      </div>
      <button onclick="loadAll(true)" class="px-3.5 py-2 rounded-lg text-xs sm:text-sm font-bold bg-navy-900 hover:bg-navy-800 text-white">↻ 새로고침</button>
    </div>
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 overflow-x-auto">
      <div id="tab-bar" class="flex items-center gap-1 border-t border-slate-100 py-1.5 min-w-max"></div>
    </nav>
  </header>

  <main id="app" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-5"></main>

  <footer class="border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-500 px-4 leading-relaxed">
    뉴스·주가·실적: 네이버 증권과 언론사 RSS에서 자동 수집 (장중 10분마다) · 일정·추천: AI(Gemini)가 매일 아침 한 번 정리<br>
    투자 전 반드시 원문 기사와 공시(DART)를 확인하세요.
  </footer>

<script>
'use strict';

const TABS = [
  { id: 'picks',    label: '1. AI 추천종목',   ai: true },
  { id: 'news',     label: '2. 오늘의 호재' },
  { id: 'events',   label: '3. 1달 앞 주요일정', ai: true },
  { id: 'earnings', label: '4. 실적 미리보기' },
  { id: 'market',   label: '5. 시장일정',      ai: true },
  { id: 'calendar', label: '6. 통합 캘린더' },
  { id: 'watch',    label: '7. 관심종목 뉴스' },
];
const NEWS_CATS = ['전체', '수주·계약', '기술수출', '임상·허가', '실적', '주주환원', 'M&A·투자', '급등·특징주', '정책·수혜'];
const EVENT_CATS = ['전체', '임상', 'FDA', '회사', '학회', '실적', 'M&A'];

// GitHub 저장소 주소 (관심종목 상시 목록 편집·키 등록 안내용)
const REPO = (() => {
  const h = location.hostname, p = location.pathname.split('/').filter(Boolean);
  if (h.endsWith('github.io')) return `https://github.com/${h.split('.')[0]}/${p[0] || ''}`;
  return 'https://github.com/gohjunwon/k-stock-radar';
})();

function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

const state = {
  tab: lsGet('kradar_tab', 'news'),
  news: null, daily: null, earnings: null, watch: null, stocks: null,
  loadError: '',
  newsCat: '전체', sector: '전체', eventCat: '전체', earnIdx: 0,
  calMonth: '', calDate: '',
  myWatch: lsGet('kradar_mywatch', []),   // 이 기기에서만 추가한 관심종목
  watchIdx: 0,
};

/* ───────── 도구 ───────── */
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(n, suffix = '') { return (n === null || n === undefined || n === '' || isNaN(n)) ? '-' : Number(n).toLocaleString() + suffix; }
function eok(n) { // 억원 → 읽기 쉬운 단위
  if (n === null || n === undefined || isNaN(n)) return '-';
  const a = Math.abs(n);
  return a >= 10000 ? (n / 10000).toFixed(a >= 100000 ? 1 : 2).replace(/\.?0+$/, '') + '조원' : Math.round(n).toLocaleString() + '억원';
}
function kstNow() {
  const now = new Date();
  const s = now.toLocaleString('sv-SE', { timeZone: 'Asia/Seoul' });
  const [date, time] = s.split(' ');
  const [hh, mm] = time.split(':').map(Number);
  const wd = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Seoul', weekday: 'short' }).format(now);
  const weekday = !['Sat', 'Sun'].includes(wd), m = hh * 60 + mm;
  let session = '주말 휴장';
  if (weekday) session = m < 480 ? '장외 시간' : m < 540 ? '장 시작 전' : m <= 930 ? '정규장 운영 중' : m <= 1080 ? '장 마감 후' : '장외 시간';
  return { date, ym: date.slice(0, 7), session };
}
function addDays(d, n) { const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd + n)).toISOString().slice(0, 10); }
function dayName(d) { const [y, m, dd] = d.split('-').map(Number); return '일월화수목금토'[new Date(y, m - 1, dd).getDay()]; }
function naverNews(q) { return `https://search.naver.com/search.naver?where=news&sort=1&query=${encodeURIComponent(q)}`; }
function naverStock(code, name) { return code ? `https://m.stock.naver.com/domestic/stock/${code}/total` : naverNews(name + ' 주가'); }
function gcal(title, date, details, time) {
  const d = date.replace(/-/g, '');
  let dates = `${d}/${addDays(date, 1).replace(/-/g, '')}`;
  if (/^\d{2}:\d{2}$/.test(time || '')) {
    const [h, m] = time.split(':').map(Number), e = Math.min(h * 60 + m + 60, 23 * 60 + 59);
    const p = x => String(x).padStart(2, '0');
    dates = `${d}T${p(h)}${p(m)}00/${d}T${p(Math.floor(e / 60))}${p(e % 60)}00&ctz=Asia/Seoul`;
  }
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${dates}&details=${encodeURIComponent(details || '')}`;
}
function a(url, text, cls = 'text-slate-600 hover:underline') { return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="${cls}">${text}</a>`; }

/* ───────── 데이터 불러오기 (AI 호출 없음, 저장된 결과 파일만 읽음) ───────── */
async function getJson(name) {
  const r = await fetch(`data/${name}?t=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${name} (${r.status})`);
  return r.json();
}
let lastSig = '';
async function loadAll(force) {
  const names = ['news', 'daily', 'earnings', 'watch'];
  const res = await Promise.allSettled(names.map(n => getJson(n + '.json')));
  const failed = [];
  res.forEach((r, i) => { if (r.status === 'fulfilled') state[names[i]] = r.value; else failed.push(names[i]); });
  state.loadError = failed.length === names.length ? '아직 수집된 데이터가 없습니다. 첫 자동 수집이 끝나면(몇 분 이내) 표시됩니다.' : '';
  if (!state.stocks) getJson('stocks.json').then(j => { state.stocks = j.stocks || []; if (state.tab === 'watch') render(); }).catch(() => {});
  const sig = names.map(n => state[n]?.updatedAt || '').join('|');
  if (force || sig !== lastSig) { lastSig = sig; render(); } else updateHeader();
}

/* ───────── 공통 조각 ───────── */
function head(title, desc, updated, aiNote) {
  return `
    <div class="rounded-2xl bg-white border border-slate-200 p-5">
      <div class="flex flex-wrap items-center gap-2">
        <h2 class="text-lg sm:text-xl font-extrabold text-navy-950">${title}</h2>
        ${aiNote ? `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-blue-50 text-navy-800 border border-blue-200">AI · 매일 07:30 한 번</span>`
                 : `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-800 border border-emerald-200">AI 없음 · 네이버/언론 자동 수집</span>`}
      </div>
      <p class="text-xs sm:text-sm text-slate-600 mt-1">${desc}</p>
      <p class="text-[11px] text-slate-500 mt-1">${updated ? '업데이트: ' + esc(updated) : ''}</p>
    </div>`;
}
function emptyMsg(text) { return `<div class="rounded-2xl bg-white border border-slate-200 p-10 text-center text-sm text-slate-500">${text}</div>`; }
function aiStatusBox() {
  const d = state.daily;
  if (!d) return '';
  if (d.status === 'no_key') return `
    <div class="rounded-2xl bg-amber-50 border border-amber-300 p-4 text-sm text-amber-950 leading-relaxed">
      이 탭은 AI(Gemini)가 하루 한 번 정리합니다. 아직 GitHub에 Gemini 키가 등록되지 않았습니다.<br>
      ${a(REPO + '/settings/secrets/actions/new', '여기를 눌러', 'font-bold underline')} 이름에 <b>GEMINI_API_KEY</b>, 값에 Gemini API 키를 넣고 저장하면 다음 날 아침부터 채워집니다.
    </div>`;
  if (d.status === 'error' && d.error) return `<div class="rounded-xl bg-rose-50 border border-rose-200 px-3 py-2 text-xs text-rose-800">⚠ 오늘 아침 AI 정리 중 오류: ${esc(d.error)} (이전 결과를 보여 줍니다)</div>`;
  return '';
}
function aiLinks(item, query, extra = '') {
  const parts = (item.links || []).map(l => a(l.uri, '🔗 ' + esc(l.title), 'text-navy-800 font-bold hover:underline'));
  parts.push(a(naverNews(query), '네이버 뉴스 검색 ↗'));
  if (item.name) parts.push(a(naverStock(item.code, item.name), '종목 정보 ↗'));
  if (extra) parts.push(extra);
  return `<div class="flex flex-wrap gap-x-3 gap-y-1 text-xs">${parts.join('')}</div>`;
}
function filterBtns(list, current, fn) {
  return `<div class="flex flex-wrap gap-1.5">${list.map((c, i) => `<button onclick="${fn}(${i})" class="px-3 py-1.5 rounded-lg text-xs font-bold ${current === c ? 'bg-navy-900 text-white' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-100'}">${esc(c)}</button>`).join('')}</div>`;
}

/* ───────── 1. AI 추천 ───────── */
function renderPicks() {
  const d = state.daily, items = d?.picks || [];
  let h = head('AI 추천종목', '아침에 모인 호재 뉴스를 바탕으로 AI가 고른 종목입니다. 가격은 참고치이며 투자 판단과 책임은 본인에게 있습니다.', d?.updatedAt, true) + aiStatusBox();
  if (!items.length) return h + emptyMsg('아직 추천 결과가 없습니다.');
  const col = s => s === '강' ? 'bg-navy-900 text-white' : s === '중' ? 'bg-blue-50 text-navy-900 border border-blue-200' : 'bg-slate-100 text-slate-700';
  return h + `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${items.map(p => `
    <div class="rounded-2xl bg-white border border-slate-200 p-5 space-y-3">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2 flex-wrap">
          <h3 class="text-lg font-extrabold text-navy-950">${esc(p.name)}</h3>
          ${p.code ? `<span class="text-xs font-mono text-slate-500">${esc(p.code)}</span>` : ''}
        </div>
        <span class="px-2.5 py-1 rounded-lg text-xs font-bold shrink-0 ${col(p.strength)}">근거 ${esc(p.strength || '-')}</span>
      </div>
      <div class="p-3 rounded-xl bg-slate-50 border border-slate-200"><div class="text-[11px] font-bold text-navy-800 mb-1">핵심 호재</div><div class="text-sm font-bold">${esc(p.catalyst)}</div></div>
      <p class="text-sm text-slate-700 leading-relaxed"><b class="text-navy-950">근거:</b> ${esc(p.reasoning)}</p>
      ${p.risk ? `<p class="text-sm text-rose-800"><b>위험:</b> ${esc(p.risk)}</p>` : ''}
      <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100 text-center">
        ${[['진입 참고', p.entry, ''], ['목표가', p.target, 'text-emerald-700'], ['손절', p.stop, 'text-rose-700']].map(([l, v, c]) =>
          `<div class="bg-slate-50 rounded-lg p-2"><div class="text-[10px] text-slate-500">${l}</div><div class="text-xs font-bold ${c} mt-0.5">${esc(v || '-')}</div></div>`).join('')}
      </div>
      ${aiLinks(p, p.name + ' ' + (p.catalyst || ''))}
    </div>`).join('')}</div>`;
}

/* ───────── 2. 오늘의 호재 ───────── */
function renderNews() {
  const n = state.news;
  let h = head('오늘의 호재', '네이버 증권·언론사 RSS에서 최근 24시간 기사를 모아, 호재 키워드(수주·계약, 임상·허가, 실적, 자사주 등)와 상장사 이름이 함께 나온 기사만 골랐습니다. 악재 단어(급락·유상증자·소송 등)가 있는 기사는 뺐고, 같은 사건은 1건으로 합쳤습니다.', n?.updatedAt);
  if (!n) return h + emptyMsg(state.loadError || '불러오는 중...');
  const all = n.catalysts || [];
  const sectors = ['전체', ...new Set(all.map(c => c.sector))].slice(0, 14);
  if (!sectors.includes(state.sector)) state.sector = '전체';
  const list = all.filter(c => (state.newsCat === '전체' || c.category === state.newsCat) && (state.sector === '전체' || c.sector === state.sector));
  window._sectors = sectors;
  return h + `
    <div class="space-y-2">
      <div class="text-[11px] font-bold text-slate-500">호재 종류</div>${filterBtns(NEWS_CATS, state.newsCat, 'setNewsCat')}
      ${sectors.length > 2 ? `<div class="text-[11px] font-bold text-slate-500 pt-1">업종</div>${filterBtns(sectors, state.sector, 'setSector')}` : ''}
    </div>
    <div class="space-y-3">
      ${list.length ? list.map(c => `
        <div class="rounded-2xl bg-white border border-slate-200 p-4 sm:p-5 space-y-2">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="px-2 py-0.5 rounded bg-navy-900 text-white text-xs font-mono font-bold">${esc(c.date.slice(5).replace('-', '/'))} ${esc(c.time)}</span>
            <span class="font-extrabold text-navy-950">${esc(c.name)}</span>
            <span class="text-xs text-slate-500 font-mono">${esc(c.code)}</span>
            <span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-blue-50 text-navy-900 border border-blue-200">${esc(c.category)}</span>
            <span class="px-2 py-0.5 rounded-full text-[11px] bg-slate-100 text-slate-600">${esc(c.sector)}</span>
            ${c.count > 1 ? `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-50 text-amber-800 border border-amber-200">${c.count}개 기사 합침</span>` : ''}
          </div>
          <h3 class="text-sm sm:text-base font-bold text-navy-950">${esc(c.title)}</h3>
          ${c.desc ? `<p class="text-sm text-slate-600 leading-relaxed">${esc(c.desc)}…</p>` : ''}
          <div class="flex flex-wrap gap-x-3 gap-y-1 text-xs">
            ${(c.links || []).map(l => a(l.url, '🔗 ' + esc(l.press || '기사 원문'), 'text-navy-800 font-bold hover:underline')).join('')}
            ${a(naverStock(c.code, c.name), '종목 정보 ↗')}
          </div>
        </div>`).join('') : emptyMsg('조건에 맞는 호재 기사가 아직 없습니다.')}
    </div>
    ${(n.headlines || []).length ? `
      <div class="rounded-2xl bg-white border border-slate-200 p-5 space-y-2">
        <h3 class="font-extrabold text-navy-950">시장 주요 뉴스</h3>
        ${n.headlines.map(x => `<div class="flex gap-3 text-sm py-1.5 border-b border-slate-100 last:border-0">
          <span class="text-xs text-slate-500 font-mono shrink-0 pt-0.5">${esc(x.time)}</span>
          <div>${a(x.link, esc(x.title), 'text-navy-950 hover:underline font-medium')} <span class="text-xs text-slate-500">${esc(x.press)}</span></div></div>`).join('')}
      </div>` : ''}
    <details class="rounded-xl bg-white border border-slate-200 px-4 py-3 text-xs text-slate-600">
      <summary class="font-bold text-navy-900">▸ 이번에 확인한 뉴스 출처</summary><div class="mt-2">${esc((n.sources || []).join(', '))}</div>
    </details>`;
}
function setNewsCat(i) { state.newsCat = NEWS_CATS[i]; render(); }
function setSector(i) { state.sector = (window._sectors || ['전체'])[i]; render(); }

/* ───────── 3. 1달 일정 ───────── */
function renderEvents() {
  const d = state.daily, items = d?.events || [];
  let h = head('1달 앞 주요 일정', '앞으로 한 달 안의 임상·허가·회사·학회·실적·M&A 일정입니다. 날짜가 확정되지 않은 것은 "예상일"로 표시합니다.', d?.updatedAt, true) + aiStatusBox();
  if (!items.length) return h + emptyMsg('아직 일정이 없습니다.');
  const list = items.filter(e => state.eventCat === '전체' || e.category === state.eventCat);
  return h + filterBtns(EVENT_CATS, state.eventCat, 'setEventCat') + `<div class="space-y-3">${list.length ? list.map(e => `
    <div class="rounded-2xl bg-white border border-slate-200 p-4 sm:p-5 flex gap-4">
      <div class="min-w-[88px] rounded-xl bg-slate-50 border border-slate-200 p-3 text-center h-fit">
        <div class="text-sm font-extrabold">${esc(e.date.slice(5).replace('-', '/'))} (${dayName(e.date)})</div>
        <div class="mt-1">${e.exact ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-navy-900 text-white">확정</span>` : `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-800 border border-amber-200">예상일</span>`}</div>
      </div>
      <div class="space-y-1.5 flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="px-2 py-0.5 rounded-md text-xs font-bold bg-slate-100">${esc(e.category)}</span>
          <span class="font-extrabold">${esc(e.name)}</span>${e.code ? `<span class="text-xs font-mono text-slate-500">${esc(e.code)}</span>` : ''}
        </div>
        <h3 class="font-bold">${esc(e.title)}</h3>
        <p class="text-sm text-slate-600">${esc(e.detail)}</p>

function addWatch(ev) {

  const typing = document.activeElement?.id === 'watch-input' ? document.activeElement.value : null;
  document.getElementById('app').innerHTML = views[state.tab]();
  if (typing !== null) { const el = document.getElementById('watch-input'); if (el) { el.value = typing; el.focus(); } }
  if (state.tab === 'earnings') mountChart();
}
function switchTab(id) { state.tab = id; lsSet('kradar_tab', id); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

render();
loadAll(true);
setInterval(() => { if (!document.hidden) loadAll(false); }, 60000); // 1분마다 새 파일이 있는지만 확인 (AI 호출 없음)
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll(false); });
</script>
